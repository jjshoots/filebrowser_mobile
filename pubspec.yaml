name: filebrowser_mobile
description: Android client for File Browser (self-hosted) with biometric login and background transfers.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Networking
  dio: ^5.7.0

  # In-app media: gallery grid thumbnails, zoomable photo viewer, video player
  cached_network_image: ^4.0.2
  photo_view: ^0.15.0
  video_player: ^2.9.0
  chewie: ^1.17.2

  # Secure credential storage (Android Keystore / EncryptedSharedPreferences)
  flutter_secure_storage: ^11.2.0

  # Biometric / device-credential authentication
  local_auth: ^3.0.2

  # Background upload/download with a native foreground service + notifications
  background_downloader: ^9.5.5

  # Simple state management / DI
  provider: ^6.1.2

  # File picking for uploads, and SAF directory picking for download targets
  file_picker: ^13.1.0

  # Hand a downloaded file off to a native Android app (PDF/text/audio/…)
  open_filex: ^4.7.0

  # System share-sheet: share-link URLs as text, and "send a copy" of files
  # fetched to the app cache (the plugin ships its own Android FileProvider,
  # so no manifest configuration is required).
  share_plus: ^13.3.0

  # Typed, non-secret UI preferences (sort order, …)
  shared_preferences: ^2.3.0

  path: ^1.9.0
  path_provider: ^2.1.4
  receive_sharing_intent: ^1.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
